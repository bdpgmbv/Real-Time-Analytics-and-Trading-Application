name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fails on unformatted code rather than reformatting it, so a diff never
      # appears in a build that was not asked for one.
      - name: Formatting
        run: ./gradlew spotlessCheck

      # Compiles with ErrorProne and NullAway, runs SpotBugs, unit tests,
      # integration tests and the coverage gate.
      - name: Build, test and verify
        run: ./gradlew checkAll --stacktrace

      - name: Software bill of materials
        run: ./gradlew cyclonedxBom

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/reports/jacoco/**
          retention-days: 7
