spring:
  application:
    name: rtat-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 250ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/rtat}

  codec:
    max-in-memory-size: 256KB

  lifecycle:
    timeout-per-shutdown-phase: 25s

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
            pool:
              type: elastic
              max-idle-time: 30s

          default-filters:
            - RemoveRequestHeader=Cookie
            - SecureHeaders

          routes:
            - id: refdata
              uri: ${RTAT_REFDATA_URI:http://localhost:8091}
              predicates:
                - Path=/api/v1/refdata/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    rate-limiter: "#{@failOpenRateLimiter}"
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                - name: CircuitBreaker
                  args:
                    name: refdataCircuit
                    statusCodes: 500,502,503,504

            - id: query
              uri: ${RTAT_QUERY_URI:http://localhost:8092}
              predicates:
                - Path=/api/v1/query/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    rate-limiter: "#{@failOpenRateLimiter}"
                    redis-rate-limiter.replenishRate: 200
                    redis-rate-limiter.burstCapacity: 400
                - name: CircuitBreaker
                  args:
                    name: queryCircuit
                    statusCodes: 500,502,503,504

            - id: hedge
              uri: ${RTAT_HEDGE_URI:http://localhost:8093}
              predicates:
                - Path=/api/v1/hedge/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    rate-limiter: "#{@failOpenRateLimiter}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                - name: CircuitBreaker
                  args:
                    name: hedgeCircuit
                    statusCodes: 500,502,503,504

server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 16KB
  netty:
    idle-timeout: 60s

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.05}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
    instances:
      refdataCircuit:
        baseConfig: default
      queryCircuit:
        baseConfig: default
      hedgeCircuit:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
    instances:
      refdataCircuit:
        baseConfig: default
      queryCircuit:
        baseConfig: default
      hedgeCircuit:
        baseConfig: default

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
