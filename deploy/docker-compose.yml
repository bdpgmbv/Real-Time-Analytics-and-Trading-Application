name: rtat

services:
  redis:
    image: redis:7-alpine
    container_name: rtat-redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M
