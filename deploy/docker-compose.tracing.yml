services:
  jaeger:
    image: jaegertracing/jaeger:2.12.0
    container_name: rtat-jaeger
    ports:
      - "${RTAT_BIND:-127.0.0.1}:16687:16686"
      - "${RTAT_BIND:-127.0.0.1}:4319:4317"
      - "${RTAT_BIND:-127.0.0.1}:4320:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/16686 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
