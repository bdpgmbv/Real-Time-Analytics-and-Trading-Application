global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rtat-ingest
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8090']
        labels:
          service: ingest

  - job_name: rtat-stream
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8091']
        labels:
          service: stream

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
