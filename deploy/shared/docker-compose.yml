# One Postgres and one Kafka for every project on this machine.
#
# Twenty projects each running their own is twenty times the memory for one
# server's worth of work. Postgres holds as many databases as you like in one
# process; Kafka holds as many topics as you like in one broker. Neither cares
# whose they are.
#
#   docker compose -p shared -f deploy/shared/docker-compose.yml up -d
#
# Then every project points at localhost:5432 and localhost:9092 and uses its
# own database and its own topic prefix.

services:
  postgres:
    image: postgres:17.10
    container_name: shared-postgres
    environment:
      POSTGRES_USER: ${SHARED_DB_USER:-dev}
      POSTGRES_PASSWORD: ${SHARED_DB_PASSWORD:?set SHARED_DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - max_connections=300
    volumes:
      - shared-postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHARED_DB_USER:-dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: shared-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://shared-kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@shared-kafka:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms1g"
    volumes:
      - shared-kafka:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1500M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  shared-postgres:
  shared-kafka:
