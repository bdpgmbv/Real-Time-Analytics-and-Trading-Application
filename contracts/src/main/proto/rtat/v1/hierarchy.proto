syntax = "proto3";

package rtat.v1;

import "google/protobuf/timestamp.proto";

option java_package = "vyshaliprabananthlal.contract.v1";
option java_multiple_files = true;

// Ownership hierarchy: Client > Fund > Account > Product > Position.
// These four levels are reference data and change far more slowly than positions.

// A hedge fund company, and the entitlement boundary: users are granted clients.
message Client {
  string client_id = 1;
  string name = 2;
  bool active = 3;
}

// A fund managed by a client.
//
// base_ccy lives here, not on the account: an exposure only means something
// relative to the currency the fund reports in.
message Fund {
  string fund_id = 1;
  string client_id = 2;
  string name = 3;
  string base_ccy = 4;
  bool active = 5;
}

// A custody or portfolio account within a fund.
//
// Position loads arrive per account, which is why account_id is the partition
// key on position topics - keying by client_id would make a large client a hot
// partition and cap parallelism at the number of clients.
message Account {
  string account_id = 1;
  string fund_id = 2;
  string client_id = 3;   // denormalised: no join on the entitlement hot path
  string name = 4;
  bool active = 5;
}

// What a position is held in.
message Product {
  string product_id = 1;
  ProductIdentifier primary_identifier = 2;
  repeated ProductIdentifier other_identifiers = 3;
  string description = 4;
  AssetCategory asset_category = 5;

  // Currency the instrument is issued in, and the one it settles in. They differ
  // more often than you would expect, and the exposure calculation needs both.
  string issue_ccy = 6;
  string settle_ccy = 7;

  optional google.protobuf.Timestamp maturity_date = 8;  // forwards, bonds
  optional string exchange = 9;
  optional string market_data_symbol = 10;
}

message ProductIdentifier {
  IdentifierType type = 1;
  string value = 2;
}

enum IdentifierType {
  IDENTIFIER_TYPE_UNSPECIFIED = 0;
  IDENTIFIER_TYPE_CUSIP = 1;
  IDENTIFIER_TYPE_ISIN = 2;
  IDENTIFIER_TYPE_SEDOL = 3;
  IDENTIFIER_TYPE_RIC = 4;
  IDENTIFIER_TYPE_BLOOMBERG = 5;
  IDENTIFIER_TYPE_INTERNAL = 6;
}

enum AssetCategory {
  ASSET_CATEGORY_UNSPECIFIED = 0;
  ASSET_CATEGORY_SECURITIES = 1;
  ASSET_CATEGORY_CASH = 2;
  ASSET_CATEGORY_ACCRUAL = 3;
  ASSET_CATEGORY_EQUITY_SWAP = 4;
  ASSET_CATEGORY_FX_FORWARD = 5;
  ASSET_CATEGORY_FX_SPOT = 6;
  ASSET_CATEGORY_FUTURE = 7;
  ASSET_CATEGORY_SWAP = 8;
}
