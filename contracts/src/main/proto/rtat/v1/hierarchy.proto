syntax = "proto3";

package rtat.v1;

import "google/protobuf/timestamp.proto";

option java_package = "vyshaliprabananthlal.contract.v1";
option java_multiple_files = true;

message Client {
  string client_id = 1;
  string name = 2;
  bool active = 3;
  Region region = 4;
  ClientTier tier = 5;
}

enum Region {
  REGION_UNSPECIFIED = 0;
  REGION_AMERICAS = 1;
  REGION_EMEA = 2;
  REGION_APAC = 3;
}

enum ClientTier {
  CLIENT_TIER_UNSPECIFIED = 0;
  CLIENT_TIER_SMALL = 1;
  CLIENT_TIER_MEDIUM = 2;
  CLIENT_TIER_LARGE = 3;
}

message Fund {
  string fund_id = 1;
  string client_id = 2;
  string name = 3;
  string base_ccy = 4;
  bool active = 5;
}

message Custodian {
  string custodian_id = 1;
  string name = 2;
  CustodianKind kind = 3;
  bool active = 4;
}

enum CustodianKind {
  CUSTODIAN_KIND_UNSPECIFIED = 0;
  CUSTODIAN_KIND_INTERNAL = 1;
  CUSTODIAN_KIND_EXTERNAL = 2;
}

message Account {
  string account_id = 1;
  string fund_id = 2;
  string client_id = 3;
  string name = 4;
  bool active = 5;
  string custodian_id = 6;
}

message Product {
  string product_id = 1;
  ProductIdentifier primary_identifier = 2;
  repeated ProductIdentifier other_identifiers = 3;
  string description = 4;
  AssetCategory asset_category = 5;

  string issue_ccy = 6;
  string settle_ccy = 7;

  optional google.protobuf.Timestamp maturity_date = 8;
  optional string exchange = 9;
  optional string market_data_symbol = 10;
}

message ProductIdentifier {
  IdentifierType type = 1;
  string value = 2;
}

enum IdentifierType {
  IDENTIFIER_TYPE_UNSPECIFIED = 0;
  IDENTIFIER_TYPE_CUSIP = 1;
  IDENTIFIER_TYPE_ISIN = 2;
  IDENTIFIER_TYPE_SEDOL = 3;
  IDENTIFIER_TYPE_RIC = 4;
  IDENTIFIER_TYPE_BLOOMBERG = 5;
  IDENTIFIER_TYPE_INTERNAL = 6;
}

enum AssetCategory {
  ASSET_CATEGORY_UNSPECIFIED = 0;
  ASSET_CATEGORY_SECURITIES = 1;
  ASSET_CATEGORY_CASH = 2;
  ASSET_CATEGORY_ACCRUAL = 3;
  ASSET_CATEGORY_EQUITY_SWAP = 4;
  ASSET_CATEGORY_FX_FORWARD = 5;
  ASSET_CATEGORY_FX_SPOT = 6;
  ASSET_CATEGORY_FUTURE = 7;
  ASSET_CATEGORY_SWAP = 8;
}
