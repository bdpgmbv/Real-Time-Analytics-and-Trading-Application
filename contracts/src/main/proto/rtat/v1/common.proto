syntax = "proto3";

package rtat.v1;

import "google/protobuf/timestamp.proto";

option java_package = "vyshaliprabananthlal.contract.v1";
option java_multiple_files = true;

message Decimal {
  bytes unscaled = 1;

  int32 scale = 2;
}

message Money {
  string ccy = 1;
  Decimal amount = 2;
}

message EventMeta {
  string event_id = 1;

  google.protobuf.Timestamp event_time = 2;

  google.protobuf.Timestamp ingest_time = 3;

  string source = 4;

  string correlation_id = 5;
}
