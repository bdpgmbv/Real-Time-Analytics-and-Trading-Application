syntax = "proto3";

package rtat.v1;

import "google/protobuf/timestamp.proto";
import "rtat/v1/common.proto";

option java_package = "vyshaliprabananthlal.contract.v1";
option java_multiple_files = true;

// One holding of one product in one account. Natural key: (account_id, product_id).
message Position {
  string account_id = 1;
  string product_id = 2;

  // Denormalised from the hierarchy so grid roll-ups and entitlement filters do
  // not need a refdata join per position.
  string fund_id = 3;
  string client_id = 4;

  Decimal quantity = 5;
  PositionType position_type = 6;
  optional Money cost_basis = 7;

  // Grid grouping attributes, deliberately NOT levels of the ownership hierarchy.
  // The grid groups by these and users regroup freely without a model change.
  optional string manager = 8;
  optional string deal = 9;

  // Forward and swap legs only.
  optional google.protobuf.Timestamp value_date = 10;
}

enum PositionType {
  POSITION_TYPE_UNSPECIFIED = 0;
  POSITION_TYPE_SECURITIES = 1;
  POSITION_TYPE_CASH = 2;
  POSITION_TYPE_ACCRUAL = 3;
  POSITION_TYPE_EQUITY_SWAP = 4;
  POSITION_TYPE_FORWARD = 5;
  POSITION_TYPE_CURRENCY_SPOT = 6;
  POSITION_TYPE_FUTURE = 7;
}

// Positions arrive as a snapshot per account.
//
// A whole snapshot in one message would be tens of megabytes for a large account -
// past Kafka's default max.message.bytes, and it would serialise the work onto one
// consumer. So positions stream individually, bracketed by boundary markers.
message PositionEvent {
  EventMeta meta = 1;
  string snapshot_id = 2;
  Position position = 3;
}

// Delimits a snapshot. The COMPLETE marker carries the expected count, which is how
// a consumer tells a finished load from a truncated one instead of valuing a partial
// portfolio. It is also the trigger for reporting sign-off once every account in a
// client has completed.
message SnapshotBoundary {
  EventMeta meta = 1;
  string snapshot_id = 2;
  string account_id = 3;
  SnapshotKind kind = 4;
  Marker marker = 5;

  // Set on COMPLETE only: how many PositionEvents belong to this snapshot.
  optional int64 position_count = 6;

  enum Marker {
    MARKER_UNSPECIFIED = 0;
    MARKER_BEGIN = 1;
    MARKER_COMPLETE = 2;
    MARKER_ABORTED = 3;
  }
}

enum SnapshotKind {
  SNAPSHOT_KIND_UNSPECIFIED = 0;
  SNAPSHOT_KIND_EOD = 1;
  SNAPSHOT_KIND_INTRADAY = 2;
}
