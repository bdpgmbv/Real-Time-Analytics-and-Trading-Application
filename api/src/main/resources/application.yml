spring:
  application:
    name: rtat-api

  datasource:
    url: ${RTAT_DB_URL:jdbc:postgresql://localhost:5432/rtat}
    username: ${RTAT_DB_USER:rtat_api}
    password: ${RTAT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${RTAT_DB_POOL:16}
      connection-init-sql: SET TIME ZONE 'UTC'

  liquibase:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${RTAT_OIDC_ISSUER:http://localhost:8180/realms/rtat}

server:
  port: ${RTAT_PORT:8095}

resilience4j:
  retry:
    instances:
      database:
        max-attempts: 3
        wait-duration: 100ms
        exponential-backoff-multiplier: 2
        # Only the failures that trying again could fix. A missing fund is not one of them.
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - org.springframework.dao.RecoverableDataAccessException
          - java.sql.SQLTransientException

  circuitbreaker:
    instances:
      database:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        # Long enough that the database gets a chance to recover before we crowd it again.
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  tracing:
    enabled: ${RTAT_TRACING:true}
    sampling:
      probability: ${RTAT_TRACE_SAMPLE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${RTAT_OTLP:http://localhost:4320/v1/traces}
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info, circuitbreakers
  server:
    port: ${RTAT_ADMIN_PORT:9193}
    address: ${RTAT_ADMIN_ADDRESS:127.0.0.1}
  endpoint:
    health:
      show-details: ${RTAT_HEALTH_DETAIL:never}
      probes:
        enabled: true
  metrics:
    tags:
      application: rtat-api

spring.kafka:
  bootstrap-servers: ${RTAT_KAFKA:localhost:9092}
  consumer:
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    auto-offset-reset: latest
    enable-auto-commit: false
    max-poll-records: 1000
  listener:
    type: batch
    ack-mode: manual_immediate

rtat:
  live:
    push-every-milliseconds: ${RTAT_LIVE_EVERY:1000}
    screen-timeout-minutes: ${RTAT_SCREEN_TIMEOUT:30}
  hedge:
    too-small-to-bother: ${RTAT_HEDGE_FLOOR:100000}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
  level:
    root: WARN
    vyshaliprabananthlal: INFO

---
spring:
  config:
    activate:
      on-profile: local

management:
  endpoint:
    health:
      show-details: always
