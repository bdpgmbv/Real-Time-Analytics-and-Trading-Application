spring:
  application:
    name: rtat-api

  datasource:
    url: ${RTAT_DB_URL:jdbc:postgresql://localhost:5432/rtat}
    username: ${RTAT_DB_USER:rtat}
    password: ${RTAT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${RTAT_DB_POOL:16}
      connection-init-sql: SET TIME ZONE 'UTC'

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${RTAT_OIDC_ISSUER:http://localhost:8180/realms/rtat}

server:
  port: ${RTAT_PORT:8095}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info
  server:
    port: ${RTAT_ADMIN_PORT:9193}
    address: ${RTAT_ADMIN_ADDRESS:127.0.0.1}
  endpoint:
    health:
      show-details: ${RTAT_HEALTH_DETAIL:never}
      probes:
        enabled: true
  metrics:
    tags:
      application: rtat-api

rtat:
  hedge:
    too-small-to-bother: ${RTAT_HEDGE_FLOOR:100000}

logging:
  level:
    root: WARN
    vyshaliprabananthlal: INFO

---
spring:
  config:
    activate:
      on-profile: local

management:
  endpoint:
    health:
      show-details: always
