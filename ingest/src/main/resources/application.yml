spring:
  application:
    name: rtat-ingest

  datasource:
    url: ${RTAT_DB_URL:jdbc:postgresql://localhost:5432/rtat}
    username: ${RTAT_DB_USER:rtat}
    password: ${RTAT_DB_PASSWORD:rtat_dev_only}
    hikari:
      maximum-pool-size: 8
      connection-init-sql: SET TIME ZONE 'UTC'

  kafka:
    bootstrap-servers: ${RTAT_KAFKA:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1000
    listener:
      type: batch
      ack-mode: manual_immediate

rtat:
  custodian-files:
    incoming: ${RTAT_INCOMING:custodian-files/incoming}
    finished: ${RTAT_FINISHED:custodian-files/finished}
    look-every-milliseconds: 2000

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: always

server:
  port: ${RTAT_PORT:8090}

logging:
  level:
    root: WARN
    org.springframework.kafka: INFO
    org.apache.kafka.clients.consumer: WARN
    vyshaliprabananthlal: INFO
