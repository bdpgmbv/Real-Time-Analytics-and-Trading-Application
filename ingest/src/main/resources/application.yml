spring:
  application:
    name: rtat-ingest

  datasource:
    url: ${RTAT_DB_URL:jdbc:postgresql://localhost:5432/rtat}
    username: ${RTAT_DB_USER:rtat}
    password: ${RTAT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${RTAT_DB_POOL:24}
      connection-init-sql: SET TIME ZONE 'UTC'

  liquibase:
    enabled: ${RTAT_MIGRATE:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${RTAT_KAFKA:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1000
    listener:
      type: batch
      ack-mode: manual_immediate
      concurrency: ${RTAT_LISTENER_THREADS:3}

rtat:
  custodian-files:
    incoming: ${RTAT_INCOMING:custodian-files/incoming}
    finished: ${RTAT_FINISHED:custodian-files/finished}
    look-every-milliseconds: 2000

management:
  tracing:
    enabled: ${RTAT_TRACING:true}
    sampling:
      probability: ${RTAT_TRACE_SAMPLE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${RTAT_OTLP:http://localhost:4320/v1/traces}
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info
  server:
    port: ${RTAT_ADMIN_PORT:9191}
    address: ${RTAT_ADMIN_ADDRESS:127.0.0.1}
  endpoint:
    health:
      show-details: ${RTAT_HEALTH_DETAIL:never}
      probes:
        enabled: true
  metrics:
    tags:
      application: rtat-ingest

server:
  port: ${RTAT_PORT:8090}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
  level:
    root: WARN
    org.springframework.kafka: INFO
    org.apache.kafka.clients.consumer: WARN
    vyshaliprabananthlal: INFO

---
spring:
  config:
    activate:
      on-profile: local

management:
  endpoint:
    health:
      show-details: always
