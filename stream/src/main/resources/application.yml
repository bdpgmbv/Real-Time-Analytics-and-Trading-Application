spring:
  application:
    name: rtat-stream

  datasource:
    url: ${RTAT_DB_URL:jdbc:postgresql://localhost:5432/rtat}
    username: ${RTAT_DB_USER:rtat}
    password: ${RTAT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      connection-init-sql: SET TIME ZONE 'UTC'

  kafka:
    bootstrap-servers: ${RTAT_KAFKA:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        linger.ms: 20
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info
  server:
    port: ${RTAT_ADMIN_PORT:9192}
    address: ${RTAT_ADMIN_ADDRESS:127.0.0.1}
  endpoint:
    health:
      show-details: ${RTAT_HEALTH_DETAIL:never}
  metrics:
    tags:
      application: rtat-stream

server:
  port: ${RTAT_PORT:8091}

logging:
  level:
    root: WARN
    vyshaliprabananthlal: INFO

---
spring:
  config:
    activate:
      on-profile: local

management:
  endpoint:
    health:
      show-details: always
